[project]
name = "searchrel"
version = "1.0.0"
description = "Product search for a synthetic outdoor gear catalog, measured end to end: query understanding, BM25 retrieval with fallback, learning to rank, click debiasing, offline evaluation, and interleaving."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.3"]

[project.scripts]
searchrel = "searchrel.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
